name: CI

# Bloquea PRs que no compilan, que tumban el arranque del API o que agregan alert/confirm/prompt.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Arranque del API (smoke test /health)
        env:
          PORT: 3999
          JWT_SECRET: ci
          SUPABASE_URL: http://localhost:1
          SUPABASE_ANON_KEY: ci
        run: |
          node dist/index.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3999/health; then echo; echo "✅ API arrancó"; exit 0; fi
            sleep 1
          done
          echo "❌ El API no respondió /health"; cat server.log; exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Sin diálogos nativos nuevos
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash scripts/check-dialogos-nativos.sh origin/${{ github.base_ref }}

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aceites-capturas-y-reporte
          path: |
            docs/presentaciones/aceites/capturas/
            frontend/playwright-report/

  inventario-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: inventario_test
          POSTGRES_DB: inventario_test
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventario_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:inventario_test@127.0.0.1:55438/inventario_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:inventario
